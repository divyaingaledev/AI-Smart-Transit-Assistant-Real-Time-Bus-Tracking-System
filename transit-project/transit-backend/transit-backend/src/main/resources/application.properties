# Application
spring.application.name=transit-backend
server.port=8080

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/transit_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=YOUR_MYSQL_PASSWORD

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT - set JWT_SECRET environment variable
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=86400000

# AI API - set AI_API_KEY environment variable
app.ai.api-key=${AI_API_KEY:}

# CORS
app.cors.allowed-origins=http://localhost:5173

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
